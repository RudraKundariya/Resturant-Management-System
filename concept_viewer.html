<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabula SRMS – UI Concept Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: #14211F; color: #FFFFFF; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #145049; border-bottom: 4px solid #EA580C; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0; }
    .brand { font-family: 'Space Grotesk', Inter, sans-serif; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .tag { font-size: 12px; background: #EA580C; color: #1C0A02; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    nav { display: flex; gap: 8px; overflow-x: auto; }
    button.tab-btn { background: #0E3A34; color: #CDEBE5; border: 1px solid #23655D; padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    button.tab-btn:hover { background: #195E56; color: #FFFFFF; }
    button.tab-btn.active { background: #FFFFFF; color: #145049; border-color: #FFFFFF; }
    .frame-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #0B1211; padding: 16px; }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    iframe.mobile { max-width: 420px; max-height: 880px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>Tabula</span>
      <span class="tag">UI CONCEPT REFERENCE</span>
    </div>
    <nav>
      <button class="tab-btn active" onclick="loadScreen('concept_0_Live_floor_map.html', false, this)">1. Live Floor Map</button>
      <button class="tab-btn" onclick="loadScreen('concept_1_Reports.html', false, this)">2. Reports & KPIs</button>
      <button class="tab-btn" onclick="loadScreen('concept_2_Kitchen_display.html', false, this)">3. Kitchen Display (KDS)</button>
      <button class="tab-btn" onclick="loadScreen('concept_3_Guest_menu_and_cart.html', true, this)">4. Guest Menu & Cart (Mobile)</button>
      <button class="tab-btn" onclick="loadScreen('concept_4_Guest_order_status_and_payment.html', true, this)">5. Guest Order & Pay (Mobile)</button>
      <button class="tab-btn" onclick="loadScreen('concept_5_Staff_cleaning_tasks.html', true, this)">6. Staff Cleaning Tasks (Mobile)</button>
    </nav>
  </header>
  <div class="frame-container">
    <iframe id="conceptFrame" src="concept_0_Live_floor_map.html"></iframe>
  </div>

  <script>
    function loadScreen(url, isMobile, btn) {
      const frame = document.getElementById('conceptFrame');
      frame.src = url;
      if (isMobile) {
        frame.classList.add('mobile');
      } else {
        frame.classList.remove('mobile');
      }
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
