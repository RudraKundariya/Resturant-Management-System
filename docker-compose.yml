services:
  postgres:
    image: postgres:15-alpine
    container_name: srms-postgres
    restart: always
    environment:
      POSTGRES_USER: srms_user
      POSTGRES_PASSWORD: srms_password
      POSTGRES_DB: srms_db
    ports:
      - "5432:5432"
    volumes:
      - srms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srms_user -d srms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: srms-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - srms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  srms_postgres_data:
  srms_redis_data:

