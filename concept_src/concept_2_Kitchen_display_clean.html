<div style="min-height:900px;box-sizing:border-box;background:#141413;color:#F3F1EA;font-family:Inter,system-ui,sans-serif;padding:24px 32px;display:flex;flex-direction:column;gap:20px">

<header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px">
<div style="display:flex;align-items:center;gap:16px">
<a href="Main.dc.html" aria-label="Back to dashboard" style="width:44px;height:44px;border-radius:12px;background:#1F1F1D;border:1px solid #34332F;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#F3F1EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;font-size:26px">Kitchen</h1>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px" role="group" aria-label="Station">
<sc-for list="{{stations}}" as="s" hint-placeholder-count="4">
<button style="{{s.style}}">{{s.label}}</button>
</sc-for>
</div>
<div style="display:flex;gap:20px;font-size:14px;color:#B5B1A6">
<span><strong style="color:#F3F1EA;font-size:20px;font-family:'Space Grotesk',Inter,sans-serif">9</strong> active</span>
<span><strong style="color:#FF9C90;font-size:20px;font-family:'Space Grotesk',Inter,sans-serif">2</strong> late</span>
<span>Avg. prep <strong style="color:#F3F1EA;font-size:20px;font-family:'Space Grotesk',Inter,sans-serif">11 min</strong></span>
</div>
</header>

<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;flex:1 1 auto">
<sc-for list="{{columns}}" as="col" hint-placeholder-count="3">
<section style="flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px">
<h2 style="margin:0;font-size:15px;font-weight:600;letter-spacing:0.02em">{{col.title}}</h2>
<span style="{{col.countStyle}}">{{col.count}}</span>
</div>
<sc-for list="{{col.tickets}}" as="t" hint-placeholder-count="3">
<article style="background:#1F1F1D;border:1px solid #34332F;border-radius:16px;overflow:hidden">
<div style="{{t.headStyle}}">
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-family:'Space Grotesk',Inter,sans-serif;font-size:20px;font-weight:600">{{t.where}}</span>
<span style="font-size:12px;opacity:0.9">{{t.meta}}</span>
</div>
<span style="font-family:'Space Grotesk',Inter,sans-serif;font-size:18px;font-weight:600">{{t.timer}}</span>
</div>
<div style="padding:8px 16px;display:flex;flex-direction:column">
<sc-for list="{{t.items}}" as="i" hint-placeholder-count="3">
<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #2B2A27">
<span style="font-family:'Space Grotesk',Inter,sans-serif;font-size:18px;font-weight:600;min-width:28px">{{i.qty}}×</span>
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-size:15px;font-weight:500">{{i.name}}</span>
<span style="font-size:13px;color:#F2B27A">{{i.note}}</span>
</div>
</div>
</sc-for>
</div>
<div style="padding:12px 16px 16px">
<button style="{{t.btnStyle}}">{{t.btn}}</button>
</div>
</article>
</sc-for>
</section>
</sc-for>
</div>
</div>
