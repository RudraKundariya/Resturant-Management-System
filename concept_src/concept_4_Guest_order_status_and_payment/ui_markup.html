body{margin:0}

<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#F4F6F5;font-family:Inter,system-ui,sans-serif;color:#14211F;overflow:hidden">

<header style="background:#145049;color:#FFFFFF;padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:4px solid #EA580C">
<a href="GuestMenu.dc.html" aria-label="Back to menu" style="width:44px;height:44px;border-radius:12px;border:1px solid #4E8A80;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="display:flex;flex-direction:column">
<span style="font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;font-size:20px">Your order</span>
<span style="font-size:13px;color:#CDEBE5">Table 7 · 3 guests</span>
</div>
</header>

<div style="flex:1 1 auto;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px">

<section aria-label="Items" style="background:#FFFFFF;border:1px solid #DDE5E2;border-radius:14px;padding:4px 16px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="4">
<div style="padding:12px 0;border-bottom:1px solid #E6EDEA;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
<span style="font-size:14px;font-weight:600">{{i.qty}}× {{i.name}}</span>
<span style="{{i.chip}}">{{i.status}}</span>
</div>
<div style="display:flex;gap:4px" aria-hidden="true">
<sc-for list="{{i.steps}}" as="s" hint-placeholder-count="4">
<div style="{{s}}"></div>
</sc-for>
</div>
</div>
</sc-for>
<p style="margin:0;padding:10px 0 8px;font-size:12px;color:#55655F">Accepted, then Preparing, Ready, Served.</p>
</section>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
<button sc-camel-on-click="{{toggleWaiter}}" style="{{waiterStyle}}">{{waiterLabel}}</button>
<button sc-camel-on-click="{{toggleBill}}" style="{{billStyle}}">{{billLabel}}</button>
</div>

<section aria-label="Bill" style="background:#FFFFFF;border:1px solid #DDE5E2;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;font-size:14px">
<div style="display:flex;justify-content:space-between"><span style="color:#55655F">Subtotal</span><span>{{subtotal}}</span></div>
<div style="display:flex;justify-content:space-between"><span style="color:#55655F">GST (5%)</span><span>{{tax}}</span></div>
<div style="display:flex;justify-content:space-between;font-size:18px;font-weight:600;padding-top:6px;border-top:1px solid #E6EDEA"><span>Total</span><span>{{total}}</span></div>
</section>

<section aria-label="Payment method" style="display:flex;flex-direction:column;gap:8px">
<h2 style="margin:0;font-size:14px;font-weight:600">Pay with</h2>
<div role="radiogroup" aria-label="Payment method" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="3">
<button role="radio" aria-checked="{{m.on}}" sc-camel-on-click="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
</sc-for>
</div>
</section>
</div>

<div style="padding:12px 16px 20px;background:#FFFFFF;border-top:1px solid #DDE5E2">
<button style="width:100%;min-height:56px;border-radius:14px;border:0;background:#EA580C;color:#1C0A02;font:600 16px Inter,sans-serif;cursor:pointer">{{payLabel}}</button>
</div>
</div>
